create type run_status as enum (
  'queued', 'running', 'awaiting_user', 'paused',
  'completed', 'failed', 'cancelled'
);

create table applications (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null references auth.users(id) on delete cascade,
  destination_country text not null,
  visa_type text not null,
  applicant_profile jsonb not null default '{}'::jsonb,
  status text not null default 'draft',
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table documents (
  id uuid primary key default gen_random_uuid(),
  application_id uuid not null references applications(id) on delete cascade,
  user_id uuid not null references auth.users(id) on delete cascade,
  kind text not null,
  storage_path text not null,
  ocr_text text,
  validation_status text not null default 'pending',
  validation_errors jsonb default '[]'::jsonb,
  created_at timestamptz not null default now()
);

create table agent_runs (
  id uuid primary key default gen_random_uuid(),
  application_id uuid not null references applications(id) on delete cascade,
  user_id uuid not null references auth.users(id) on delete cascade,
  status run_status not null default 'queued',
  current_step text,
  input jsonb not null default '{}'::jsonb,
  result jsonb,
  error text,
  started_at timestamptz,
  finished_at timestamptz,
  created_at timestamptz not null default now()
);

create table agent_events (
  id bigserial primary key,
  run_id uuid not null references agent_runs(id) on delete cascade,
  seq bigint not null,
  type text not null,
  payload jsonb not null,
  created_at timestamptz not null default now(),
  unique (run_id, seq)
);

create table browser_sessions (
  id uuid primary key default gen_random_uuid(),
  run_id uuid not null references agent_runs(id) on delete cascade,
  portal text not null,
  storage_state jsonb,
  user_agent text,
  created_at timestamptz not null default now()
);

alter table applications enable row level security;
alter table documents enable row level security;
alter table agent_runs enable row level security;
alter table agent_events enable row level security;
alter table browser_sessions enable row level security;

create policy "own application access" on applications
for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

create policy "own document access" on documents
for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

create policy "own run access" on agent_runs
for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

create policy "own event access" on agent_events
for select using (
  exists (
    select 1 from agent_runs r
    where r.id = agent_events.run_id and r.user_id = auth.uid()
  )
);

create policy "own browser session access" on browser_sessions
for select using (
  exists (
    select 1 from agent_runs r
    where r.id = browser_sessions.run_id and r.user_id = auth.uid()
  )
);
